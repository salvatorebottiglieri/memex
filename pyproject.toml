[project]
name = "memex"
version = "0.2.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Salvatore Bottiglieri", email = "sasibottiglieri0@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "click>=8.4.2",
    "playwright>=1.61.0",
    "pyyaml>=6.0.3",
    "telethon>=1.44.0",
]

[project.optional-dependencies]
media = [
    "pypdf>=5.4.0",
    "youtube-transcript-api>=1.0.0",
]

[project.scripts]
memex = "memex.cli:cli"

[build-system]
requires = ["uv_build>=0.11.15,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pypdf>=5.4.0",
    "ruff>=0.15.0,<0.16",
    "pytest-cov>=7.0",
    "mypy>=1.10",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/memex"]
branch = false
parallel = true
patch = ["subprocess"]

[tool.coverage.report]
fail_under = 85
show_missing = false
skip_covered = true

[tool.mypy]
python_version = "3.12"
files = ["src"]
warn_unused_ignores = true

# Optional extras: not installed in the dev env, so no stubs to check against.
[[tool.mypy.overrides]]
module = ["anthropic", "telethon", "telethon.*", "youtube_transcript_api"]
ignore_missing_imports = true
